name: 'Unit Tests'

on: [push]

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']
        thrift-version: ['0.16.*', '0.22.*', '0.24.*']

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup PHP
        id: setup-php
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php-version }}"
          extensions: "sockets"
          tools: "composer"

      - name: Install dependencies
        run: composer install --ansi --no-interaction --no-progress --prefer-dist

      - name: Select thrift version
        run: composer update apache/thrift --with "apache/thrift:${{ matrix.thrift-version }}" -W --ansi --no-interaction --no-progress --prefer-dist

      - name: Run tests
        run: composer test
